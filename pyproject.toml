[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neurograph"
version = "0.1.0"
description = "Local-first evidence-backed context packs for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NeuroGraph contributors" }]
dependencies = [
  "duckdb>=1.0.0",
  "typer>=0.12.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ng = "neurograph.cli:main"
neurograph = "neurograph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["neurograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
